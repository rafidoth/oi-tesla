name: CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy
        required: true
        default: release/v1.0.0

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Continuous Deployment
    needs: ci
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ github.event.release.tag_name || inputs.ref }}

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DEPLOY_REF
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.TARGET_DIR || '~/OiTesla' }}"
            TARGET_DIR="${TARGET_DIR/#\~/$HOME}"

            cd "$TARGET_DIR" || { echo "Directory $TARGET_DIR not found"; exit 1; }

            echo "=== Deploying $DEPLOY_REF ==="
            git fetch --all --tags --prune
            git checkout --force "$DEPLOY_REF"
            # if DEPLOY_REF is a branch, sync it to the remote
            git reset --hard "origin/$DEPLOY_REF" 2>/dev/null || true

            cd server
            docker compose up -d --build
            docker image prune -f

            echo "=== Deployment successful ==="
